<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Lipedema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="arquivos/style-login.css">
</head>

<body>
    <div class="container-login" id="container">

        <div class="form-container sign-up-container">
            <form action="arquivos/perfil.html" method="GET" class="form-cadastro">
                <h1>Criar Conta</h1>
                <p class="subtitulo-form">Lipedema </p>

                <input type="text" placeholder="Nome Completo" required />
                <input type="email" placeholder="E-mail" required />
                <input type="password" placeholder="Senha" required />

                <button type="submit" class="btn-submit">Cadastrar</button>
            </form>
        </div>

        <div class="form-container sign-in-container">
            <form action="arquivos/perfil.html" method="GET" class="form-login">
                <h1>Lipedema Insights</h1>
                <p class="subtitulo-form">Bem-vinda de volta!</p>

                <input type="email" placeholder="E-mail" required />
                <input type="password" placeholder="Senha" required />

                <p class="pointer" data-bs-toggle="modal" data-bs-target="#exampleModal">Esqueceu sua senha?</p>
                <button type="submit" class="btn-submit">Entrar</button>
            </form>
        </div>

        <div class="overlay-container">
            <div class="overlay">

                <div class="overlay-panel overlay-left">
                    <h1 class="dark">Olá de Novo!</h1>
                    <p>Para se conectar, por favor, faça o seu login.</p>
                    <button class="ghost" id="signIn">Login</button>
                </div>

                <div class="overlay-panel overlay-right">
                    <h1 class="dark">Primeira Vez Aqui?</h1>
                    <p>Insira seus dados pessoais e comece sua jornada de informação sobre Lipedema!</p>
                    <button class="ghost" id="signUp">Cadastrar</button>
                </div>
            </div>
        </div>
    </div>


    <!-- Modal para recuperação de senha -->
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">Redefinição de senha</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3 w-100">
                        <label for="recipient-name" class="col-form-label">Email</label>
                        <input type="text" class="form-control" id="recipient-name">
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-sm button" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-sm button" data-bs-dismiss="modal">Enviar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="arquivos/lipedema.js"></script>
</body>

</html>
